name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # pin Bun version ตาม ADR-0001
          bun-version: 1.3.5

      # postinstall ของ dashboard รัน `nuxt prepare` ซึ่ง generate .nuxt/tsconfig.*.json
      # ที่ typecheck ต้องใช้ — ห้ามข้าม postinstall
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      # ครอบคลุมทุก workspace รวม dashboard (nuxt typecheck -> vue-tsc)
      - name: Typecheck
        run: bun run typecheck

      - name: Migration check (up / down / up จากฐานข้อมูลว่าง)
        run: bun run migrate:check

      - name: Test
        run: bun test

      - name: Dashboard production build
        run: bun run --filter @zixploy/dashboard build
