# Traefik สำหรับ local development
# Production compose (control-plane เต็ม) มาใน Phase 8
#
#   docker compose -f deploy/control-plane/docker-compose.dev.yml up -d
#
# ใช้ ACME staging เท่านั้นใน dev — ห้ามชี้ production resolver จากเครื่อง dev

services:
  traefik:
    image: traefik:v3.6
    container_name: zixploy-traefik-dev
    restart: unless-stopped
    command:
      - --providers.docker=true
      # เห็นเฉพาะ container ที่ติด traefik.enable=true (docs/phase-05)
      - --providers.docker.exposedByDefault=false
      - --providers.docker.network=zixploy-proxy
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      # dev dashboard — insecure mode ใช้ได้เฉพาะ local เท่านั้น
      - --api.insecure=true
      - --log.level=INFO
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
      - "127.0.0.1:8080:8080"
    volumes:
      # read-only socket: Traefik อ่าน labels อย่างเดียว
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-acme:/acme
    networks:
      - zixploy-proxy

volumes:
  traefik-acme:

networks:
  zixploy-proxy:
    name: zixploy-proxy
