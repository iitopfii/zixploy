name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # pin Bun version ตาม ADR-0001
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: |
          bunx tsc --noEmit -p internal/shared
          bunx tsc --noEmit -p internal/db
          bunx tsc --noEmit -p apps/control-api
          bunx tsc --noEmit -p apps/deploy-worker

      - name: Migration check (up / down / up จากฐานข้อมูลว่าง)
        run: bun run migrate:check

      - name: Test
        run: bun test

      - name: Dashboard build
        run: bun run --filter @zixploy/dashboard build
