# Zixploy — Server Deployment
# ใช้กับ: docker compose -f deploy/server/docker-compose.yml up -d --build
#
# สถาปัตยกรรม:
#   port 80  → Traefik → /api/* → control-api:3001
#                               → /*     → dashboard:3000
#   port 443 → Traefik → project containers (routing จาก Docker labels ที่ worker สร้าง)
#   worker เข้า Docker socket โดยตรง
#
# TLS มี 2 ทางพร้อมกัน (ต่อ domain เลือกได้):
#   1. Let's Encrypt — certresolver=letsencrypt, ACME HTTP-01 challenge ผ่าน port 80
#   2. Custom certificate — control-api เขียน PEM ลง zixploy-certs แล้ว Traefik อ่านผ่าน
#      file provider (ดู apps/control-api/src/domains/tls-materialize.ts)
#      ใช้กับ wildcard, EV cert หรือ Cloudflare Origin CA ที่ ACME ออกให้ไม่ได้
#
# Cloudflare: เมื่อ proxy เปิด ทุก request มาจาก Cloudflare edge — ต้องประกาศ trustedIPs
# ไม่งั้น rate limit/audit log จะเห็นแต่ IP ของ Cloudflare ไม่ใช่ client จริง
# ค่า CIDR ต้องตรงกับ internal/shared/src/cloudflare.ts เสมอ

services:

  # ── Traefik ────────────────────────────────────────────────────────────────
  traefik:
    image: traefik:v3.6
    container_name: zixploy-traefik
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedByDefault=false
      - --providers.docker.network=zixploy-proxy
      # file provider สำหรับ custom certificate — watch ไฟล์ที่ control-api เขียน
      - --providers.file.directory=/certs/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      # ── Cloudflare trusted IPs (ต้องตรงกับ internal/shared/src/cloudflare.ts) ──
      # ไม่ใช้ insecure=true เด็ดขาด — จะเชื่อ X-Forwarded-For จากใครก็ได้ = spoof IP ได้ฟรี
      - --entrypoints.web.forwardedHeaders.trustedIPs=173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32
      - --entrypoints.websecure.forwardedHeaders.trustedIPs=173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32
      # ── ACME (Let's Encrypt) ──
      # ACME_EMAIL: ตั้งใน deploy/server/.env เพื่อรับแจ้งเตือนก่อน cert หมดอายุ
      # ปล่อยว่างได้ (ACME อนุญาต account ที่ไม่มี contact) แต่ **ห้ามใส่ค่าที่ไม่ใช่อีเมลจริง**
      # — Let's Encrypt ปฏิเสธทั้ง account ถ้า domain ของอีเมลไม่มีจุด (เช่น admin@localhost)
      # แล้ว cert ทุกใบขอไม่ได้ทั้งเซิร์ฟเวอร์
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-}
      - --certificatesresolvers.letsencrypt.acme.storage=/acme/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      # staging server สำหรับทดสอบ — production มี rate limit 5 cert/domain/สัปดาห์
      # ตั้ง ACME_CA_SERVER=https://acme-staging-v02.api.letsencrypt.org/directory ตอนเทสต์
      - --certificatesresolvers.letsencrypt.acme.caserver=${ACME_CA_SERVER:-https://acme-v02.api.letsencrypt.org/directory}
      - --api=false
      # ping ต้องเปิดคู่กับ healthcheck ด้านล่าง — `traefik healthcheck --ping` ยิงไปที่
      # /ping ของ entrypoint traefik (:8080) ซึ่งไม่มีอยู่ถ้าไม่ตั้ง --ping=true
      - --ping=true
      - --log.level=INFO
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # ro: Traefik อ่าน cert อย่างเดียว — เขียนโดย control-api เท่านั้น
      - zixploy-certs:/certs:ro
      - zixploy-acme:/acme
    networks:
      - zixploy-proxy
    # control-api สร้าง /certs/dynamic ตอนบูต — Traefik ต้องรอ ไม่งั้น file provider
    # ตายตั้งแต่ start ("unable to read directory") แล้ว custom cert ไม่ทำงานจนกว่าจะ restart
    depends_on:
      - control-api
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── Control API ────────────────────────────────────────────────────────────
  control-api:
    build:
      context: ../..
      dockerfile: apps/control-api/Dockerfile
    image: zixploy/control-api:local
    container_name: zixploy-control-api
    restart: unless-stopped
    environment:
      # origin-guard ตัด localhost/127.0.0.1 ออกจาก allowlist เฉพาะเมื่อ NODE_ENV=production
      # ไม่ตั้ง = ใครส่ง `Host: localhost` มาก็ผ่านการตรวจ Host header ตลอด (plugins/origin-guard.ts)
      #
      # ต้องมีสองอย่างนี้ก่อนถึงตั้งค่านี้ได้โดยไม่ทำระบบล่ม (ทั้งคู่แก้แล้ว — อย่าถอยกลับ):
      # 1. Secure flag ของ cookie ดูจาก scheme ของ ZIXPLOY_BASE_URL ไม่ใช่ NODE_ENV (auth/session.ts)
      #    ไม่งั้นการติดตั้งแบบ http://<ip> จะ login ไม่ได้ทั้งระบบ
      # 2. /system/health ยกเว้นการตรวจ Host (origin-guard.ts) ไม่งั้น Docker healthcheck ที่ยิง
      #    `Host: 127.0.0.1:3001` ได้ 400 → container unhealthy → Traefik ข้าม → API ตายทั้งระบบ
      NODE_ENV: production
      ZIXPLOY_DB_PATH: /data/control.db
      ZIXPLOY_API_PORT: "3001"
      ZIXPLOY_LOG_LEVEL: info
      ZIXPLOY_BASE_URL: http://${SERVER_IP:-localhost}
      ZIXPLOY_BIND_HOST: "0.0.0.0"
      # IP สาธารณะของ server — DNS check เทียบ A/AAAA record กับค่านี้
      # ไม่ตั้ง = ทุก domain ได้ mismatch (fail closed) ยกเว้นที่ผ่าน Cloudflare
      ZIXPLOY_PUBLIC_IPS: ${SERVER_IP:-127.0.0.1}
      ZIXPLOY_MASTER_KEY_FILE: /run/secrets/master_key
      ZIXPLOY_BACKUP_DB_DIR: /backups/db
      ZIXPLOY_BACKUP_KEYS_DIR: /backups/keys
      ZIXPLOY_BACKUP_RETENTION: "14"
      # backup ของ managed service (database) — volume เดียวกับด้านบนแต่คนละ subdirectory
      # ("services/<id>/") worker เป็นคนเขียนไฟล์จริง ที่นี่แค่อ่าน/ลบ/stream ให้ดาวน์โหลด (Phase 16)
      ZIXPLOY_BACKUPS_DIR: /backups
      # custom TLS certificate — control-api เขียน, Traefik อ่าน (mount จุดเดียวกันทั้งคู่)
      ZIXPLOY_TLS_DIR: /certs
      # เลขรุ่นที่ deploy จริง (ตั้งใน .env ทุกครั้งที่ deploy ใหม่) — โชว์ใน sidebar เฉย ๆ
      # ห้ามลบ ZIXPLOY_DISABLE_SELF_UPDATE ด้านล่างแม้ตั้งเลขรุ่นแล้ว: compose ไฟล์นี้ใช้ build:
      # ไม่มี image tag ให้ "docker compose pull" ปุ่มอัปเดตในหน้าเว็บจึงใช้งานจริงไม่ได้เลย
      # (ตัดสินใจเมื่อ 2026-08-13 — ดู internal/shared/src/version.ts)
      ZIXPLOY_VERSION: ${ZIXPLOY_VERSION:-dev}
      ZIXPLOY_DISABLE_SELF_UPDATE: "true"
      # bearer secret ยืนยันว่า worker ที่ต่อ WebSocket เข้ามาที่ /internal/terminal-relay
      # เป็นตัวจริง — คนละหน้าที่กับ master key (ไม่เข้ารหัสอะไร แค่ auth) (Phase 17)
      ZIXPLOY_INTERNAL_TOKEN_FILE: /run/secrets/internal_token
    volumes:
      - zixploy-data:/data
      - zixploy-backups:/backups
      # rw: control-api เป็นตัวเดียวที่เขียน cert (Traefik mount :ro)
      - zixploy-certs:/certs
      - /etc/zixploy/master.key:/run/secrets/master_key:ro
      - /etc/zixploy/internal.token:/run/secrets/internal_token:ro
    expose:
      - "3001"
    networks:
      - zixploy-internal
      - zixploy-proxy
    labels:
      traefik.enable: "true"
      traefik.http.routers.api.rule: "PathPrefix(`/api/`)"
      traefik.http.routers.api.entrypoints: web
      traefik.http.services.api.loadbalancer.server.port: "3001"
    # 127.0.0.1 ไม่ใช่ localhost: `localhost` ใน container resolve เป็น ::1 (IPv6) ก่อน
    # แต่ Bun bind แค่ 0.0.0.0 (IPv4) → connection refused → container ขึ้น unhealthy
    # → **Traefik docker provider ข้าม container ที่ไม่ healthy** → ไม่มี router → 404 ทั้งเว็บ
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/v1/system/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Deploy Worker ──────────────────────────────────────────────────────────
  deploy-worker:
    build:
      context: ../..
      dockerfile: apps/deploy-worker/Dockerfile
    image: zixploy/deploy-worker:local
    container_name: zixploy-deploy-worker
    restart: unless-stopped
    environment:
      ZIXPLOY_DB_PATH: /data/control.db
      ZIXPLOY_WORKSPACES_DIR: /workspaces
      ZIXPLOY_LOG_LEVEL: info
      ZIXPLOY_MASTER_KEY_FILE: /run/secrets/master_key
      # ที่เก็บ dump ของ managed service (database) — volume เดียวกับที่ control-api backup ตัวเอง
      # (Phase 16) subdirectory "services/<id>/" กันชนกับ db/keys/acme ของ control-api
      ZIXPLOY_BACKUPS_DIR: /backups
      # ต่อ WebSocket ออกไปหา control-api ตรง ๆ ผ่าน zixploy-internal network (ไม่ผ่าน Traefik)
      # เพื่อ relay terminal session เข้า container — ชื่อ container คือ hostname ในเครือข่ายนี้เอง
      ZIXPLOY_CONTROL_API_URL: http://control-api:3001
      ZIXPLOY_INTERNAL_TOKEN_FILE: /run/secrets/internal_token
    volumes:
      - zixploy-data:/data
      - zixploy-workspaces:/workspaces
      - zixploy-backups:/backups
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/zixploy/master.key:/run/secrets/master_key:ro
      - /etc/zixploy/internal.token:/run/secrets/internal_token:ro
    networks:
      - zixploy-internal
      - zixploy-proxy
    depends_on:
      - control-api

  # ── Dashboard ──────────────────────────────────────────────────────────────
  dashboard:
    build:
      context: ../..
      dockerfile: apps/dashboard/Dockerfile
    image: zixploy/dashboard:local
    container_name: zixploy-dashboard
    restart: unless-stopped
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
    expose:
      - "3000"
    networks:
      - zixploy-internal
      - zixploy-proxy
    labels:
      traefik.enable: "true"
      traefik.http.routers.dashboard.rule: "PathPrefix(`/`)"
      traefik.http.routers.dashboard.entrypoints: web
      traefik.http.services.dashboard.loadbalancer.server.port: "3000"
      # API router มี priority สูงกว่า (match ก่อน)
      traefik.http.routers.dashboard.priority: "1"
    # 127.0.0.1 ไม่ใช่ localhost — เหตุผลเดียวกับ control-api ด้านบน
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      - control-api

networks:
  zixploy-proxy:
    name: zixploy-proxy
    driver: bridge
  zixploy-internal:
    name: zixploy-internal
    driver: bridge
    internal: true

volumes:
  zixploy-data:
    name: zixploy-data
  zixploy-workspaces:
    name: zixploy-workspaces
  zixploy-backups:
    name: zixploy-backups
  # custom TLS certificate ที่ผู้ใช้อัปโหลด — private key อยู่ในนี้ ต้อง backup แบบเข้ารหัส
  # (source of truth คือ DB ที่เข้ารหัสไว้แล้ว — volume นี้ regenerate ได้จาก DB เสมอ)
  zixploy-certs:
    name: zixploy-certs
  # ACME account key + cert ที่ Let's Encrypt ออกให้ — หายแล้วต้องขอใหม่ (ติด rate limit)
  zixploy-acme:
    name: zixploy-acme
