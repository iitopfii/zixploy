# Zixploy — Production stack (ติดตั้งผ่าน install.sh)
#
# ต่างจาก deploy/server/docker-compose.yml ตรงที่ **ไม่ build อะไรเลย** — pull image
# สำเร็จรูปจาก GHCR เท่านั้น เซิร์ฟเวอร์จึงไม่ต้องมีซอร์สและไม่ต้องมี toolchain สำหรับ build
#
# ทุกค่าที่ต่างกันในแต่ละเครื่องอยู่ใน .env ที่ install.sh สร้างให้ (ZIXPLOY_VERSION,
# SERVER_IP, ACME_EMAIL, ZIXPLOY_HTTP_PORT/ZIXPLOY_HTTPS_PORT) — ตัวไฟล์นี้เหมือนกันทุกเครื่อง
# จึงอัปทับได้เสมอตอน update
#
# ZIXPLOY_HTTP_PORT/ZIXPLOY_HTTPS_PORT เปลี่ยนแค่ port ฝั่ง host เท่านั้น — entrypoint ภายใน
# Traefik (ใน command: ด้านล่าง) ยังคง :80/:443 เสมอ ไม่ต้องแก้คู่กัน (ดู install.sh)

services:
  traefik:
    image: traefik:v3.6
    container_name: zixploy-traefik
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedByDefault=false
      - --providers.docker.network=zixploy-proxy
      - --providers.file.directory=/certs/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      # Cloudflare CIDR — เมื่ออยู่หลัง proxy ต้องเชื่อ X-Forwarded-For จาก IP เหล่านี้เท่านั้น
      # ไม่ใช้ insecure=true ซึ่งจะเชื่อทุกต้นทางจนปลอม IP ได้
      - --entrypoints.web.forwardedHeaders.trustedIPs=173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22
      - --entrypoints.websecure.forwardedHeaders.trustedIPs=173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-}
      - --certificatesresolvers.letsencrypt.acme.storage=/acme/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --api=false
      - --ping=true
      - --log.level=INFO
    ports:
      # host:container — เปลี่ยนได้ผ่าน ZIXPLOY_HTTP_PORT/ZIXPLOY_HTTPS_PORT ใน .env (ฝั่ง container
      # ต้องคงที่ :80/:443 เพราะ Traefik เองรู้จักตัวเองที่ entrypoint นี้เท่านั้น — ดู command: ด้านบน)
      - "${ZIXPLOY_HTTP_PORT:-80}:80"
      - "${ZIXPLOY_HTTPS_PORT:-443}:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - zixploy-certs:/certs:ro
      - zixploy-acme:/acme
    networks:
      - zixploy-proxy
    # control-api สร้าง /certs/dynamic ตอนบูต — Traefik ต้องรอ ไม่งั้น file provider
    # ตายตั้งแต่ start แล้ว custom cert ไม่ทำงานจนกว่าจะ restart
    depends_on:
      - control-api
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 15s
      timeout: 5s
      retries: 3

  control-api:
    image: ghcr.io/iitopfii/zixploy-control-api:${ZIXPLOY_VERSION}
    container_name: zixploy-control-api
    restart: unless-stopped
    environment:
      # secureCookies (auth/session.ts) และ origin-guard เข้มงวดขึ้นเฉพาะตอน NODE_ENV=production
      # (session/CSRF cookie ได้ Secure flag, allowlist ตัด localhost/127.0.0.1 ออก) — ไม่ตั้งค่านี้
      # ทั้งสองจุดจะหลวมแบบ dev ตลอดแม้รันจริง ต้องตั้งเสมอในทุก environment ที่รับ traffic จริง
      NODE_ENV: production
      ZIXPLOY_DB_PATH: /data/control.db
      ZIXPLOY_API_PORT: "3001"
      ZIXPLOY_LOG_LEVEL: info
      ZIXPLOY_BASE_URL: ${ZIXPLOY_BASE_URL}
      ZIXPLOY_BIND_HOST: "0.0.0.0"
      ZIXPLOY_PUBLIC_IPS: ${SERVER_IP}
      ZIXPLOY_MASTER_KEY_FILE: /run/secrets/master_key
      ZIXPLOY_BACKUP_DB_DIR: /backups/db
      ZIXPLOY_BACKUP_KEYS_DIR: /backups/keys
      ZIXPLOY_BACKUP_RETENTION: "14"
      # backup ของ managed service (database) — volume เดียวกับด้านบนแต่คนละ subdirectory
      # ("services/<id>/") worker เป็นคนเขียนไฟล์จริง ที่นี่แค่อ่าน/ลบ/stream ให้ดาวน์โหลด (Phase 16)
      ZIXPLOY_BACKUPS_DIR: /backups
      # เวอร์ชันที่รันอยู่ — ตัวตรวจ update เทียบค่านี้กับ tag ล่าสุดบน registry
      ZIXPLOY_VERSION: ${ZIXPLOY_VERSION}
    volumes:
      - zixploy-data:/data
      - zixploy-backups:/backups
      - zixploy-certs:/certs
      - /etc/zixploy/master.key:/run/secrets/master_key:ro
    expose:
      - "3001"
    networks:
      - zixploy-internal
      - zixploy-proxy
    labels:
      traefik.enable: "true"
      traefik.http.routers.api.rule: "PathPrefix(`/api/`)"
      traefik.http.routers.api.entrypoints: web
      traefik.http.services.api.loadbalancer.server.port: "3001"
    # 127.0.0.1 ไม่ใช่ localhost: localhost ใน container resolve เป็น ::1 (IPv6) ก่อน
    # แต่ Bun bind แค่ 0.0.0.0 → connection refused → unhealthy → Traefik ข้าม container
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/v1/system/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  deploy-worker:
    image: ghcr.io/iitopfii/zixploy-deploy-worker:${ZIXPLOY_VERSION}
    container_name: zixploy-deploy-worker
    restart: unless-stopped
    environment:
      ZIXPLOY_DB_PATH: /data/control.db
      ZIXPLOY_WORKSPACES_DIR: /workspaces
      ZIXPLOY_LOG_LEVEL: info
      ZIXPLOY_MASTER_KEY_FILE: /run/secrets/master_key
      ZIXPLOY_VERSION: ${ZIXPLOY_VERSION}
      # updater ต้องรู้ว่า compose file อยู่ที่ไหนบน host เพื่อ mount เข้า container ตัวเอง
      ZIXPLOY_INSTALL_DIR: ${ZIXPLOY_INSTALL_DIR:-/opt/zixploy}
      # ที่เก็บ dump ของ managed service (database) — volume เดียวกับที่ control-api backup ตัวเอง
      ZIXPLOY_BACKUPS_DIR: /backups
    volumes:
      - zixploy-data:/data
      - zixploy-workspaces:/workspaces
      - zixploy-backups:/backups
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/zixploy/master.key:/run/secrets/master_key:ro
    networks:
      - zixploy-internal
      - zixploy-proxy
    depends_on:
      - control-api

  dashboard:
    image: ghcr.io/iitopfii/zixploy-dashboard:${ZIXPLOY_VERSION}
    container_name: zixploy-dashboard
    restart: unless-stopped
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
    expose:
      - "3000"
    networks:
      - zixploy-internal
      - zixploy-proxy
    labels:
      traefik.enable: "true"
      traefik.http.routers.dashboard.rule: "PathPrefix(`/`)"
      traefik.http.routers.dashboard.entrypoints: web
      traefik.http.services.dashboard.loadbalancer.server.port: "3000"
      traefik.http.routers.dashboard.priority: "1"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      - control-api

networks:
  zixploy-proxy:
    name: zixploy-proxy
    driver: bridge
  zixploy-internal:
    name: zixploy-internal
    driver: bridge
    internal: true

volumes:
  zixploy-data:
    name: zixploy-data
  zixploy-workspaces:
    name: zixploy-workspaces
  zixploy-backups:
    name: zixploy-backups
  zixploy-certs:
    name: zixploy-certs
  zixploy-acme:
    name: zixploy-acme
